title: 'Windows - CaddyWiper Deployment Pattern: Executable Started From C:\Windows Root by a Scheduled Task'
id: f735cfc5-1d29-44d0-adcf-cf6efb03fa0f
status: experimental
description: |
  Detects an executable placed directly in C:\Windows (for example msserver.exe) being launched by the Task
  Scheduler. Sandworm's TANKTRAP utility used two GPOs to copy CaddyWiper to C:\Windows\msserver.exe and create
  scheduled tasks on 12 October 2022. In April 2022 CaddyWiper was also pushed by GPO. Legitimate software rarely
  installs new executables in the Windows root.
references:
  - https://cloud.google.com/blog/topics/threat-intelligence/sandworm-disrupts-power-ukraine-operational-technology
  - https://www.welivesecurity.com/2022/04/12/industroyer2-industroyer-reloaded/
author: Stelios Partsinevelos
date: 2026-11-22
tags:
  - attack.privilege-escalation
  - attack.t1484.001
  - attack.execution
  - attack.t1053.005
  - attack.impact
  - attack.t1485
logsource:
  category: process_creation
  product: windows
detection:
  selection_parent:
    ParentImage|endswith:
      - '\svchost.exe'
      - '\taskeng.exe'
    ParentCommandLine|contains: 'Schedule'
  selection_path:
    Image|re: '(?i)^C:\\Windows\\[^\\]+\.exe$'
  filter_known:
    Image|endswith:
      - '\explorer.exe'
      - '\regedit.exe'
      - '\notepad.exe'
      - '\hh.exe'
      - '\write.exe'
      - '\splwow64.exe'
      - '\winhlp32.exe'
      - '\bfsvc.exe'
      - '\HelpPane.exe'
  condition: all of selection_* and not filter_known
falsepositives:
  - Vendor agents that install into C:\Windows (baseline and add to the filter)
level: high
